<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doña Lú · CRM Sídney</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F3B26">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%230F3B26%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-style%3D%22italic%22%20font-size%3D%2232%22%20fill%3D%22%23D3BD93%22%3EL%C3%BA%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,300..900;1,300..900&family=Archivo:wdth,wght@62..125,300..800&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
:root{--verde:#0F3B26;--verde2:#163F2C;--kraft:#D3BD93;--kraft2:#C4AC80;--papel:#EEE5D2;--hueso:#F7F2E7;--tinta:#1B1915;--tinta2:#4B463D;--tinta3:#7B7366;--barro:#9A4A2E;--azul:#2B4C6F;--oro:#B8924A;--cereza:#9E2B25;--hoja:#4B5A3A;
--slab:"Bitter",Georgia,serif;--grot:"Archivo","Helvetica Neue",Arial,sans-serif;--sten:"Saira Stencil One",Impact,sans-serif;--line:rgba(27,25,21,.2)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--kraft) repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px);color:var(--tinta);font:400 15px/1.45 var(--grot);font-variation-settings:"wdth" 96;min-height:100svh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lb{font:600 11px/1.2 var(--grot);font-variation-settings:"wdth" 78;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta2)}
.st{font-family:var(--sten);font-weight:400;text-transform:uppercase;line-height:1}
h1,h2,h3{font-family:var(--slab);font-weight:800;letter-spacing:-.02em;line-height:1.05;color:var(--verde)}

/* barra */
.top{position:sticky;top:0;z-index:30;background:rgba(238,229,210,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--tinta);display:flex;align-items:center;gap:14px;padding:10px clamp(14px,3vw,28px);flex-wrap:wrap}
.top .logo{width:84px;color:var(--verde);display:block;flex:none}
.top .logo svg{display:block;width:100%;height:auto}
.top h1{font-size:18px;font-weight:700}
.top h1 small{display:block;font:600 10.5px/1.3 var(--grot);font-variation-settings:"wdth" 78;text-transform:uppercase;letter-spacing:.06em;color:var(--azul)}
.top .sp{flex:1}
.btn{font:600 12px/1 var(--grot);font-variation-settings:"wdth" 86;text-transform:uppercase;letter-spacing:.04em;padding:10px 13px;border:2px solid var(--tinta);background:var(--hueso);color:var(--tinta);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--tinta);color:var(--papel)}
.btn.p{background:var(--verde);border-color:var(--verde);color:var(--papel)}
.btn.p:hover{background:var(--tinta);border-color:var(--tinta)}
.btn.s{padding:7px 10px;font-size:11px}
.btn.ghost{background:none}
.dirty{font:600 11px/1 var(--grot);text-transform:uppercase;letter-spacing:.04em;color:var(--barro);display:none;align-items:center;gap:8px}
.dirty.on{display:inline-flex}
.dirty i{width:8px;height:8px;border-radius:50%;background:var(--barro);display:inline-block}

/* layout */
.wrap{padding:clamp(14px,3vw,28px);display:grid;gap:18px}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:2px;background:var(--tinta);border:2px solid var(--tinta)}
.pipe button{background:var(--hueso);padding:12px 12px 10px;text-align:left;display:grid;gap:4px;transition:background .2s}
.pipe button:hover{background:var(--papel)}
.pipe button.on{background:var(--verde);color:var(--papel)}
.pipe button.on .lb{color:var(--kraft)}
.pipe b{font:400 30px/1 var(--sten);color:var(--azul)}
.pipe button.on b{color:var(--papel)}
.pipe button:first-child b{color:var(--tinta)}
.pipe button.on:first-child b{color:var(--papel)}
.filters{display:grid;grid-template-columns:minmax(220px,2fr) repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.f{display:grid;gap:5px}
.f input,.f select{width:100%;padding:10px 11px;border:2px solid var(--tinta);background:var(--hueso);font-size:14px;font-variation-settings:"wdth" 92;appearance:none;-webkit-appearance:none;border-radius:0}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--tinta) 50%),linear-gradient(135deg,var(--tinta) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .n{font:600 12px/1 var(--grot);text-transform:uppercase;letter-spacing:.04em;color:var(--tinta2);margin-right:auto}
.seg{display:inline-flex;border:2px solid var(--tinta)}
.seg button{padding:8px 12px;font:600 11px/1 var(--grot);text-transform:uppercase;letter-spacing:.04em;background:var(--hueso);border-right:2px solid var(--tinta)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--tinta);color:var(--papel)}

/* tabla */
.tbl{background:var(--hueso);border:2px solid var(--tinta);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{position:sticky;top:0;background:var(--verde);color:var(--papel);font:600 11px/1.2 var(--grot);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 12px;cursor:pointer;white-space:nowrap;user-select:none}
th.sorted::after{content:" ▾";opacity:.8}
th.sorted.asc::after{content:" ▴"}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(15,59,38,.06)}
tr.row.sel td{background:rgba(43,76,111,.1)}
td .nm{font:700 15px/1.2 var(--slab);color:var(--verde);display:block}
td .zn{font-size:12px;color:var(--tinta3)}
.pr{font:400 15px/1 var(--sten);width:26px;height:26px;display:inline-grid;place-items:center;border:2px solid currentColor}
.pr.A{color:var(--barro)}.pr.B{color:var(--azul)}.pr.C{color:var(--tinta3)}
.est{display:inline-block;font:600 10.5px/1 var(--grot);text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;border:1.5px solid currentColor;white-space:nowrap}
.est.nuevo{color:var(--tinta3)}.est.contactado{color:var(--azul)}.est.respondio{color:#2F6B8E}.est.muestra{color:var(--barro)}.est.negociando{color:#8B6A1A}.est.cliente{color:var(--verde);background:rgba(15,59,38,.1)}.est.pausado{color:var(--tinta3);border-style:dashed}.est.descartado{color:var(--tinta3);text-decoration:line-through}
.ch{display:inline-flex;gap:6px;flex-wrap:wrap}
.ch a,.ch span{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--line);color:var(--tinta2);text-decoration:none;font-size:12px}
.ch a:hover{border-color:var(--tinta);color:var(--tinta)}
.ch .wa{color:#1f7a4d}
.late{color:var(--barro);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--tinta3)}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--hueso);border:2px solid var(--tinta);padding:14px 14px 12px;cursor:pointer;display:grid;gap:8px}
.card:hover{background:var(--papel)}
.card .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .nm{font:800 18px/1.1 var(--slab);color:var(--verde)}
.card .zn{font-size:12px;color:var(--tinta3)}
.card p{font-size:13px;color:var(--tinta2)}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line)}

/* ficha */
.sheet{position:fixed;inset:0;z-index:40;visibility:hidden;pointer-events:none}
.sheet .bg{position:absolute;inset:0;background:rgba(27,25,21,0);transition:background .3s}
.sheet .pane{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--papel);border-left:2px solid var(--tinta);transform:translateX(100%);transition:transform .4s cubic-bezier(.22,.61,.36,1);overflow:auto;display:flex;flex-direction:column}
.sheet.open{visibility:visible;pointer-events:auto}
.sheet.open .bg{background:rgba(27,25,21,.45)}
.sheet.open .pane{transform:none}
.ph{position:sticky;top:0;background:var(--papel);border-bottom:3px solid var(--tinta);padding:14px 18px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.ph h2{font-size:24px}
.ph .zn{font-size:12.5px;color:var(--tinta3);margin-top:3px}
.ph .x{margin-left:auto}
.pb{padding:16px 18px 28px;display:grid;gap:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.kv dt{font:600 11px/1.6 var(--grot);font-variation-settings:"wdth" 78;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta2)}
.kv dd a{color:var(--azul)}
.sec{border-top:2px solid var(--tinta);padding-top:12px;display:grid;gap:10px}
.sec h3{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-family:var(--grot);color:var(--tinta)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f textarea{width:100%;min-height:70px;padding:10px 11px;border:2px solid var(--tinta);background:var(--hueso);font-size:14px;resize:vertical;border-radius:0}
.log{list-style:none;display:grid;gap:6px}
.log li{display:grid;grid-template-columns:86px 28px 1fr;gap:8px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.log li .d{font:600 12px/1.5 var(--grot);color:var(--tinta3)}
.log li .w{font:400 13px/1.5 var(--sten);color:var(--azul)}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.porque{font:italic 500 16px/1.4 var(--slab);color:var(--verde);border-left:3px solid var(--barro);padding-left:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--tinta);color:var(--papel);padding:12px 16px;font:600 12px/1 var(--grot);text-transform:uppercase;letter-spacing:.05em;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hoy{background:var(--verde);color:var(--papel);border:2px solid var(--verde);padding:14px 16px;display:grid;gap:8px}
.hoy h2{color:var(--papel);font-size:18px;display:flex;gap:10px;align-items:baseline}
.hoy h2 b{font:400 26px/1 var(--sten);color:var(--kraft)}
.hoy ul{list-style:none;display:grid;gap:4px;font-size:13.5px}
.hoy li{display:flex;gap:10px;flex-wrap:wrap;cursor:pointer;padding:4px 0;border-bottom:1px solid rgba(238,229,210,.2)}
.hoy li:hover{color:var(--kraft)}
.hoy li .d{font:600 12px/1.6 var(--grot);color:var(--kraft);width:84px}
.hoy li .n{font-weight:700}
.hoy li .a{color:rgba(238,229,210,.8)}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(27,25,21,.5);padding:16px}
.modal.open{display:grid}
.modal .box{background:var(--papel);border:2px solid var(--tinta);width:min(620px,100%);max-height:92svh;overflow:auto;padding:18px;display:grid;gap:12px}
.modal h2{font-size:22px}
@media(max-width:700px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}.filters{grid-template-columns:1fr 1fr}.filters .f:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../" aria-label="Doña Lú"><svg viewBox="0 0 2880 1008" aria-hidden="true"><use href="#wm"/></svg></a>
  <h1>CRM Sídney<small>Café que se honra · Australia</small></h1>
  <span class="sp"></span>
  <span class="dirty" id="dirty"><i></i><span id="dirtyn">0</span> cambios sin exportar</span>
  <button class="btn s ghost" id="bImport">Importar JSON</button>
  <button class="btn s" id="bExport">Exportar JSON</button>
  <button class="btn s p" id="bNew">+ Prospecto</button>
  <input type="file" id="fileIn" accept="application/json" class="sr">
</header>

<main class="wrap">
  <section class="hoy" id="hoy" hidden>
    <h2><b id="hoyn">0</b> para hoy o atrasados</h2>
    <ul id="hoyl"></ul>
  </section>
  <section class="pipe" id="pipe" aria-label="Pipeline"></section>
  <section class="filters">
    <div class="f"><label class="lb" for="q">Buscar</label><input id="q" type="search" placeholder="Nombre, zona, por qué, dirección… (tecla /)"></div>
    <div class="f"><label class="lb" for="fReg">Región</label><select id="fReg"><option value="">Todas</option></select></div>
    <div class="f"><label class="lb" for="fCat">Categoría</label><select id="fCat"><option value="">Todas</option></select></div>
    <div class="f"><label class="lb" for="fPri">Prioridad</label><select id="fPri"><option value="">Todas</option><option>A</option><option>B</option><option>C</option></select></div>
    <div class="f"><label class="lb" for="fOwn">Dueño</label><select id="fOwn"><option value="">Todos</option><option value="JC">JC</option><option value="DH">DH</option><option value="_">Sin asignar</option></select></div>
    <div class="f"><label class="lb" for="fCan">Canal</label><select id="fCan"><option value="">Todos</option><option value="visita">Visita</option><option value="instagram">Instagram</option><option value="email">Correo</option><option value="whatsapp">WhatsApp</option><option value="web">Web / formulario</option><option value="_email">Tiene correo</option><option value="_tel">Tiene teléfono</option></select></div>
  </section>
  <section class="tools">
    <span class="n" id="count">—</span>
    <div class="seg" role="group" aria-label="Vista"><button class="on" data-v="tabla">Tabla</button><button data-v="tarjetas">Tarjetas</button></div>
    <button class="btn s ghost" id="bClear">Limpiar filtros</button>
    <button class="btn s ghost" id="bCsv">Descargar CSV</button>
  </section>
  <section class="tbl" id="vTabla">
    <table>
      <thead><tr>
        <th data-k="prioridad" style="width:48px">Pri.</th><th data-k="nombre">Local</th><th data-k="categoria">Categoría</th><th data-k="region">Región</th><th data-k="estado">Estado</th><th data-k="owner" style="width:60px">Dueño</th><th>Canales</th><th data-k="nextDate">Próximo paso</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Nada con esos filtros.</div>
  </section>
  <section class="cards" id="vCards" hidden></section>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="bg" data-close></div>
  <aside class="pane" role="dialog" aria-modal="true" aria-labelledby="shName">
    <div class="ph"><div><h2 id="shName"></h2><p class="zn" id="shZone"></p></div><button class="btn s x" data-close>Cerrar</button></div>
    <div class="pb" id="shBody"></div>
  </aside>
</div>

<div class="modal" id="modal"><div class="box">
  <h2>Nuevo prospecto</h2>
  <div class="grid2">
    <div class="f"><label class="lb">Nombre *</label><input id="nNombre"></div>
    <div class="f"><label class="lb">Categoría</label><select id="nCat"></select></div>
    <div class="f"><label class="lb">Zona</label><input id="nZona" placeholder="Surry Hills"></div>
    <div class="f"><label class="lb">Región</label><select id="nReg"></select></div>
    <div class="f"><label class="lb">Instagram</label><input id="nIg" placeholder="@usuario"></div>
    <div class="f"><label class="lb">Correo</label><input id="nEmail" type="email"></div>
    <div class="f"><label class="lb">Teléfono</label><input id="nTel" placeholder="+61 …"></div>
    <div class="f"><label class="lb">Web</label><input id="nWeb" placeholder="https://"></div>
  </div>
  <div class="f"><label class="lb">Dirección</label><input id="nDir"></div>
  <div class="f"><label class="lb">Por qué encaja</label><textarea id="nPorque"></textarea></div>
  <div class="tools"><span class="n"></span><button class="btn s ghost" id="nCancel">Cancelar</button><button class="btn s p" id="nSave">Guardar</button></div>
</div></div>

  var fc=$('#fCat');Object.keys(cats).sort().forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;fc.appendChild(o)});
  var nc=$('#nCat');Object.keys(cats).sort().forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;nc.appendChild(o)});
  var nr=$('#nReg');Object.keys(REGS).forEach(function(r){var o=document.createElement('option');o.value=r;o.textContent=REGS[r];nr.appendChild(o)});
}

/* ——— filtrar y ordenar ——— */
function filtered(){
  var q=$('#q').value.trim().toLowerCase(),reg=$('#fReg').value,cat=$('#fCat').value,pri=$('#fPri').value,own=$('#fOwn').value,can=$('#fCan').value;
  return data.filter(function(p){
    if(filt.estado&&p.estado!==filt.estado)return false;
    if(reg&&(p.region||'')!==reg)return false;if(cat&&p.categoria!==cat)return false;if(pri&&p.prioridad!==pri)return false;
    if(own==='_'?p.owner:own&&p.owner!==own)return false;
    if(can==='_email'?!p.email:can==='_tel'?!(p.telefono||p.whatsapp):can&&p.canal!==can)return false;
    if(q){var h=[p.nombre,p.zona,p.direccion,p.porque,p.categoria,p.instagram,p.email,p.nextAction,(p.log||[]).map(function(l){return l.nota}).join(' ')].join(' ').toLowerCase();if(h.indexOf(q)<0)return false}
    return true;
  }).sort(function(a,b){var x=a[sortK]||'',y=b[sortK]||'';if(sortK==='nextDate'){x=x||'9999';y=y||'9999'}var r=x<y?-1:x>y?1:0;if(!r)r=(a.prioridad||'Z').localeCompare(b.prioridad||'Z')||a.nombre.localeCompare(b.nombre);return sortAsc?r:-r});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tel(t){return 'tel:'+String(t).replace(/[^\d+]/g,'')}
function wa(t){return 'https://wa.me/'+String(t).replace(/[^\d]/g,'')}
function igUrl(h){return 'https://instagram.com/'+String(h).replace(/^@/,'')}
function maps(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.nombre+' '+(p.direccion||p.zona||'Sydney'))}
function chans(p){var h='';if(p.instagram)h+='<a href="'+esc(igUrl(p.instagram))+'" target="_blank" rel="noopener" title="Instagram '+esc(p.instagram)+'">IG</a>';if(p.email)h+='<a href="mailto:'+esc(p.email)+'" title="'+esc(p.email)+'">@</a>';if(p.whatsapp)h+='<a class="wa" href="'+esc(wa(p.whatsapp))+'" target="_blank" rel="noopener" title="WhatsApp">W</a>';if(p.telefono)h+='<a href="'+esc(tel(p.telefono))+'" title="'+esc(p.telefono)+'">☎</a>';if(p.web)h+='<a href="'+esc(p.web)+'" target="_blank" rel="noopener" title="Sitio web">↗</a>';h+='<a href="'+esc(maps(p))+'" target="_blank" rel="noopener" title="Mapa">⌖</a>';return '<span class="ch">'+h+'</span>'}

/* ——— render ——— */
function render(){
  var t=today();
  // pipeline
  var counts={};data.forEach(function(p){counts[p.estado]=(counts[p.estado]||0)+1});
  $('#pipe').innerHTML='<button data-e="" class="'+(filt.estado===''?'on':'')+'"><span class="lb">Todos</span><b>'+data.length+'</b></button>'+ESTADOS.map(function(e){return '<button data-e="'+e+'" class="'+(filt.estado===e?'on':'')+'"><span class="lb">'+ELAB[e]+'</span><b>'+(counts[e]||0)+'</b></button>'}).join('');
  // hoy
  var due=data.filter(function(p){return p.nextDate&&p.nextDate<=t&&p.estado!=='cliente'&&p.estado!=='descartado'}).sort(function(a,b){return a.nextDate.localeCompare(b.nextDate)});
  $('#hoy').hidden=!due.length;$('#hoyn').textContent=due.length;
  $('#hoyl').innerHTML=due.slice(0,12).map(function(p){return '<li data-s="'+esc(p.slug)+'"><span class="d">'+esc(p.nextDate)+'</span><span class="n">'+esc(p.nombre)+'</span><span class="a">'+esc(p.nextAction||'')+'</span></li>'}).join('')+(due.length>12?'<li><span class="a">… y '+(due.length-12)+' más</span></li>':'');
  var list=filtered();$('#count').textContent=list.length+' de '+data.length+' prospectos';
  $$('th[data-k]').forEach(function(th){th.classList.toggle('sorted',th.dataset.k===sortK);th.classList.toggle('asc',th.dataset.k===sortK&&sortAsc)});
  if(view==='tabla'){
    $('#vTabla').hidden=false;$('#vCards').hidden=true;$('#empty').hidden=!!list.length;
    $('#rows').innerHTML=list.map(function(p){var late=p.nextDate&&p.nextDate<t&&p.estado!=='cliente'&&p.estado!=='descartado';return '<tr class="row'+(cur&&cur.slug===p.slug?' sel':'')+'" data-s="'+esc(p.slug)+'"><td><span class="pr '+esc(p.prioridad)+'">'+esc(p.prioridad)+'</span></td><td><span class="nm">'+esc(p.nombre)+'</span><span class="zn">'+esc(p.zona||'')+(p.porque?' · '+esc(p.porque):'')+'</span></td><td>'+esc(p.categoria)+'</td><td>'+esc(REGS[p.region||'']||p.region)+'</td><td><span class="est '+esc(p.estado)+'">'+esc(ELAB[p.estado]||p.estado)+'</span></td><td><span class="st" style="color:var(--azul)">'+esc(p.owner||'—')+'</span></td><td>'+chans(p)+'</td><td'+(late?' class="late"':'')+'>'+(p.nextDate?esc(p.nextDate)+' · ':'')+esc(p.nextAction||'')+'</td></tr>'}).join('');
  }else{
    $('#vTabla').hidden=true;$('#vCards').hidden=false;
    $('#vCards').innerHTML=list.map(function(p){return '<article class="card" data-s="'+esc(p.slug)+'"><div class="h"><div><div class="nm">'+esc(p.nombre)+'</div><div class="zn">'+esc(p.categoria)+' · '+esc(p.zona||REGS[p.region||''])+'</div></div><span class="pr '+esc(p.prioridad)+'">'+esc(p.prioridad)+'</span></div>'+(p.porque?'<p>'+esc(p.porque)+'</p>':'')+'<div class="ft"><span class="est '+esc(p.estado)+'">'+esc(ELAB[p.estado]||p.estado)+'</span>'+chans(p)+'</div></article>'}).join('')||'<div class="empty">Nada con esos filtros.</div>';
  }
}

/* ——— ficha ——— */
var TPL={
 dm:function(p){return 'Hi '+p.nombre+'! I\'m Juan Carlos, based in Sydney. I bring in coffee from a family farm in Colombia (Finca Danubio, Arabia, Risaralda) — washed, honey and natural from the same land. I love what you do with your coffee. Could I drop off a bag for your team to cup this week? No strings, I just want your honest opinion.'},
 email:function(p){return 'Subject: A single-farm Colombian coffee for '+p.nombre+' — sample?\n\nHi '+p.nombre+' team,\n\nMy name is Juan Carlos Higuera. I live in Sydney and I import Doña Lú, a coffee from one family farm in Arabia, Risaralda, in Colombia\'s coffee region. Every cherry is picked by hand and we offer the same farm in three processes: washed (clean and bright), honey (sweet, with body) and natural (fruity and deep).\n\nI\'d like to leave a 250 g bag with you to taste, and if it fits your shelf or your filter program we can talk about small, regular orders.\n\nWould this week suit you for a quick visit?\n\nThank you,\nJuan Carlos Higuera · Doña Lú Australia'},
 wa:function(p){return 'Hi '+p.nombre+', Juan Carlos here from Doña Lú, a Colombian family-farm coffee. I\'d love to drop off a sample bag for your team this week — would it work?'},
 es:function(p){return 'Hola, soy Juan Carlos, colombiano en Sídney. Estoy trayendo el café de Doña Lú, una finca familiar de Arabia, Risaralda, con tres procesos: lavado, honey y natural. Me encantaría que lo probaran en '+p.nombre+'. ¿Les llevo una bolsa esta semana?'},
 follow:function(p){return 'Hi '+p.nombre+', did the team get to try the Doña Lú? I\'d love to hear what you thought — and which of the three you liked most.'}
};
function openSheet(slug){var p=data.filter(function(x){return x.slug===slug})[0];if(!p)return;cur=p;
  $('#shName').textContent=p.nombre;$('#shZone').textContent=[p.categoria,p.zona,REGS[p.region||'']].filter(Boolean).join(' · ');
  var opt=function(list,v,lab){return list.map(function(e){return '<option value="'+esc(e)+'"'+(e===v?' selected':'')+'>'+esc(lab?lab[e]||e:e)+'</option>'}).join('')};
  $('#shBody').innerHTML=
  (p.porque?'<p class="porque">'+esc(p.porque)+'</p>':'')+
  '<dl class="kv">'+(p.direccion?'<dt>Dirección</dt><dd><a href="'+esc(maps(p))+'" target="_blank" rel="noopener">'+esc(p.direccion)+'</a></dd>':'')+(p.web?'<dt>Web</dt><dd><a href="'+esc(p.web)+'" target="_blank" rel="noopener">'+esc(p.web.replace(/^https?:\/\//,''))+'</a></dd>':'')+(p.instagram?'<dt>Instagram</dt><dd><a href="'+esc(igUrl(p.instagram))+'" target="_blank" rel="noopener">'+esc(p.instagram)+'</a></dd>':'')+(p.facebook?'<dt>Facebook</dt><dd><a href="'+esc(p.facebook)+'" target="_blank" rel="noopener">perfil</a></dd>':'')+(p.linkedin?'<dt>LinkedIn</dt><dd><a href="'+esc(p.linkedin)+'" target="_blank" rel="noopener">perfil</a></dd>':'')+(p.email?'<dt>Correo</dt><dd><a href="mailto:'+esc(p.email)+'">'+esc(p.email)+'</a></dd>':'')+(p.telefono?'<dt>Teléfono</dt><dd><a href="'+esc(tel(p.telefono))+'">'+esc(p.telefono)+'</a></dd>':'')+(p.whatsapp?'<dt>WhatsApp</dt><dd><a href="'+esc(wa(p.whatsapp))+'" target="_blank" rel="noopener">'+esc(p.whatsapp)+'</a></dd>':'')+Object.keys(p.extra||{}).map(function(k){return '<dt>'+esc(k.replace(/_/g,' '))+'</dt><dd>'+esc(p.extra[k])+'</dd>'}).join('')+(p.fuente?'<dt>Fuente</dt><dd><a href="'+esc(p.fuente)+'" target="_blank" rel="noopener">verificado aquí</a></dd>':'')+'</dl>'+
  '<div class="sec"><h3>Gestión</h3><div class="grid2">'+
  '<div class="f"><label class="lb">Estado</label><select id="eEstado">'+opt(ESTADOS,p.estado,ELAB)+'</select></div>'+
  '<div class="f"><label class="lb">Prioridad</label><select id="ePri">'+opt(['A','B','C'],p.prioridad)+'</select></div>'+
  '<div class="f"><label class="lb">Dueño</label><select id="eOwn">'+opt(['','JC','DH'],p.owner||'',{'':'Sin asignar'})+'</select></div>'+
  '<div class="f"><label class="lb">Canal</label><select id="eCan">'+opt(['visita','instagram','email','whatsapp','web'],p.canal)+'</select></div>'+
  '<div class="f"><label class="lb">Próximo paso</label><input id="eNext" value="'+esc(p.nextAction||'')+'"></div>'+
  '<div class="f"><label class="lb">Fecha</label><input id="eDate" type="date" value="'+esc(p.nextDate||'')+'"></div>'+
  '</div></div>'+
  '<div class="sec"><h3>Bitácora</h3><ul class="log" id="eLog">'+(p.log||[]).slice().reverse().map(function(l){return '<li><span class="d">'+esc(l.fecha)+'</span><span class="w">'+esc(l.quien)+'</span><span>'+esc(l.nota)+'</span></li>'}).join('')+'</ul>'+
  '<div class="f"><label class="lb">Nueva nota (quién: <select id="eWho" style="width:auto;padding:2px 24px 2px 6px"><option'+(ME==='JC'?' selected':'')+'>JC</option><option'+(ME==='DH'?' selected':'')+'>DH</option></select>)</label><textarea id="eNota" placeholder="Qué pasó: visita, respuesta, muestra entregada, pedido…"></textarea></div>'+
  '<div class="tools"><span class="n"></span><button class="btn s p" id="eAdd">Agregar al log</button></div></div>'+
  '<div class="sec"><h3>Plantillas</h3><div class="tpl"><button class="btn s" data-t="dm">Copiar DM Instagram</button><button class="btn s" data-t="email">Copiar correo</button><button class="btn s" data-t="wa">Copiar WhatsApp</button><button class="btn s" data-t="es">Copiar en español</button><button class="btn s" data-t="follow">Copiar seguimiento</button></div><p style="font-size:12.5px;color:var(--tinta3)">Edita el texto antes de enviarlo y registra el envío en la bitácora. Nunca precio en el primer mensaje.</p></div>'+
  '<div class="sec"><h3>Ficha</h3><p style="font-size:12.5px;color:var(--tinta3)">slug <code>'+esc(p.slug)+'</code>'+(over[p.slug]?' · tiene cambios locales sin exportar':'')+'</p><div class="tools"><span class="n"></span><button class="btn s ghost" id="eUndo"'+(over[p.slug]?'':' disabled')+'>Descartar cambios locales</button></div></div>';
  $('#sheet').classList.add('open');$('#sheet').setAttribute('aria-hidden','false');
  var bind=function(id,k){$(id).addEventListener('change',function(){var patch={};patch[k]=this.value;set(p,patch);render();toast('Guardado')})};
  bind('#eEstado','estado');bind('#ePri','prioridad');bind('#eOwn','owner');bind('#eCan','canal');bind('#eNext','nextAction');bind('#eDate','nextDate');
  $('#eWho').addEventListener('change',function(){ME=this.value;localStorage.setItem(LS+':me',ME)});
  $('#eAdd').addEventListener('click',function(){var n=$('#eNota').value.trim();if(!n)return;var log=(p.log||[]).concat([{fecha:today(),quien:$('#eWho').value,nota:n}]);var patch={log:log};if(p.estado==='nuevo')patch.estado='contactado';set(p,patch);openSheet(p.slug);render();toast('Nota agregada')});
  $$('.tpl button').forEach(function(b){b.addEventListener('click',function(){copy(TPL[b.dataset.t](p));toast('Texto copiado')})});
  $('#eUndo').addEventListener('click',function(){delete over[p.slug];save();merge();openSheet(p.slug);render();toast('Cambios locales descartados')});
  render();
}
function closeSheet(){$('#sheet').classList.remove('open');$('#sheet').setAttribute('aria-hidden','true');cur=null;render()}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t)}else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}}
var tt;function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on')},1600)}

/* ——— exportar / importar / csv / nuevo ——— */
function download(name,text,type){var b=new Blob([text],{type:type||'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},500)}
$('#bExport').addEventListener('click',function(){var out=data.map(function(p){var c=JSON.parse(JSON.stringify(p));delete c.__new;return c}).sort(function(a,b){return a.prioridad.localeCompare(b.prioridad)||(a.region||'').localeCompare(b.region||'')||a.nombre.localeCompare(b.nombre)});download('prospectos.json',JSON.stringify(out,null,1)+'\n');toast('JSON exportado · reemplaza data/prospectos.json y haz commit')});
$('#bImport').addEventListener('click',function(){$('#fileIn').click()});
$('#fileIn').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;base=j;over={};save();merge();render();toast('Base importada ('+j.length+')')}catch(e){toast('Archivo inválido')}};r.readAsText(f);this.value=''});
$('#bCsv').addEventListener('click',function(){var cols=['prioridad','nombre','categoria','zona','region','direccion','web','instagram','email','telefono','whatsapp','estado','owner','canal','nextAction','nextDate','porque','fuente'];var rows=[cols.join(',')].concat(filtered().map(function(p){return cols.map(function(k){return '"'+String(p[k]==null?'':p[k]).replace(/"/g,'""')+'"'}).join(',')}));download('prospectos.csv','﻿'+rows.join('\n'),'text/csv;charset=utf-8');});
$('#bNew').addEventListener('click',function(){$('#modal').classList.add('open');$('#nNombre').focus()});
$('#nCancel').addEventListener('click',function(){$('#modal').classList.remove('open')});
$('#nSave').addEventListener('click',function(){var n=$('#nNombre').value.trim();if(!n){toast('Falta el nombre');return}var slug=n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');if(data.some(function(p){return p.slug===slug})){toast('Ya existe');return}
  var p={slug:slug,nombre:n,categoria:$('#nCat').value||'otro',zona:$('#nZona').value.trim(),region:$('#nReg').value,direccion:$('#nDir').value.trim(),web:$('#nWeb').value.trim(),instagram:$('#nIg').value.trim(),facebook:'',linkedin:'',email:$('#nEmail').value.trim(),telefono:$('#nTel').value.trim(),whatsapp:'',porque:$('#nPorque').value.trim(),prioridad:'B',estado:'nuevo',owner:ME,canal:'visita',nextAction:'Primer contacto',nextDate:'',log:[{fecha:today(),quien:ME,nota:'Agregado desde el CRM'}],fuente:'',extra:{}};
  over[slug]={__new:p};save();merge();render();$('#modal').classList.remove('open');['#nNombre','#nZona','#nDir','#nWeb','#nIg','#nEmail','#nTel','#nPorque'].forEach(function(i){$(i).value=''});openSheet(slug);toast('Prospecto creado')});

/* ——— eventos ——— */
$('#pipe').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;filt.estado=b.dataset.e;render()});
['#q','#fReg','#fCat','#fPri','#fOwn','#fCan'].forEach(function(s){$(s).addEventListener('input',render)});
$('#bClear').addEventListener('click',function(){['#q','#fReg','#fCat','#fPri','#fOwn','#fCan'].forEach(function(s){$(s).value=''});filt.estado='';render()});
$$('.seg button').forEach(function(b){b.addEventListener('click',function(){view=b.dataset.v;$$('.seg button').forEach(function(x){x.classList.toggle('on',x===b)});render()})});
$$('th[data-k]').forEach(function(th){th.addEventListener('click',function(){if(sortK===th.dataset.k)sortAsc=!sortAsc;else{sortK=th.dataset.k;sortAsc=true}render()})});
document.addEventListener('click',function(e){var r=e.target.closest('[data-s]');if(r&&!e.target.closest('a'))openSheet(r.dataset.s);if(e.target.closest('[data-close]'))closeSheet()});
addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheet();$('#modal').classList.remove('open')}if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
load();
})();
</script>
